{% extends "base.html" %}

{% block title %}{{ t("about") }} - {{ t("app_title") }}{% endblock %}

{% block content %}
<div class="glass-card card-primary" style="max-width: 800px; margin: 40px auto; padding: 40px;">
    <div class="card-header" style="justify-content: center; text-align: center; margin-bottom: 30px;">
        <h2 class="card-title" style="font-size: 2rem; color: var(--primary);">
            <i class="fa-solid fa-circle-info" style="font-size: 1.8rem; margin-right: 8px;"></i>
            {{ t("about_title") }}
        </h2>
    </div>
    
    <div style="font-size: 1.1rem; line-height: 1.8; color: var(--text-primary); text-align: center; margin-bottom: 24px;">
        <p>{{ t("about_text") }}</p>
    </div>

    <div style="border-top: 1px solid var(--border-color); padding-top: 24px; text-align: center; margin-top: 30px;">
        <h4 style="font-size: 1.15rem; color: var(--primary); margin-bottom: 12px; font-weight: 700;">
            {{ t("ai_branding_title") }}
        </h4>
        <p style="font-size: 0.95rem; color: var(--text-secondary);">
            {{ t("footer_text") }}
        </p>
    </div>
</div>
{% endblock %}
